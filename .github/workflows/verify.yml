name: Verify tracker
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install pinned Python dependencies
        run: python -m pip install -e '.[vision,api,headless,openvino,test]'
      - name: Prepare checksum verified public test models
        run: |
          python scripts/setup_webcam_model.py --model yolox
          python scripts/setup_webcam_model.py --model nanodet
          python scripts/setup_reid_model.py
      - name: Install frontend dependencies
        working-directory: prototype
        run: npm ci
      - name: Build frontend before API tests
        working-directory: prototype
        run: npm run build
      - name: Python regressions
        run: python -m pytest -o addopts= -q --basetemp=runtime/ci-tests -p no:cacheprovider
      - name: Frontend regressions
        working-directory: prototype
        run: npm test
